server:
  port: 8080

spring:
  application:
    name: ms-barriodigital-bff

barriodigital:
  requests:
    base-url: ${MS_REQUESTS_URL:http://localhost:8081}
  catalog:
    base-url: ${MS_CATALOG_URL:http://localhost:8082}
  security:
    issuer-uri: ${AAD_ISSUER_URI:https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0}
    audiences:
      - ${AAD_API_CLIENT_ID:api://00000000-0000-0000-0000-000000000000}
    required-scope: ${AAD_REQUIRED_SCOPE:access_as_user}

management:
  endpoints:
    web:
      exposure:
        include: health
